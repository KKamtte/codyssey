services:
  web:
    build: ./app
    ports:
      - "${FLASK_PORT}:${FLASK_PORT}"
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - FLASK_PORT=${FLASK_PORT}
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - memo-data:/var/lib/postgresql/data

volumes:
  memo-data: