<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="[이름]의 포트폴리오 - 자기소개, 기술 스택, 프로젝트, 연락처">
  <title>[이름] | Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="nav__logo" href="#hero">[이름]</a>
      <button class="nav__toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-menu">
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
        <span class="nav__toggle-bar"></span>
      </button>
      <ul class="nav__menu" id="nav-menu">
        <li><a class="nav__link" href="#about">About</a></li>
        <li><a class="nav__link" href="#skills">Skills</a></li>
        <li><a class="nav__link" href="#projects">Projects</a></li>
        <li><a class="nav__link" href="#contact">Contact</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="다크 모드 전환">🌙</button>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <p class="hero__greeting">Hello!</p>
      <h1 class="hero__title" id="hero-title">I am <span class="hero__name">[이름]</span>.</h1>
      <p class="hero__lead">[한 줄 소개]</p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="#projects">View Projects</a>
        <a class="btn btn--secondary" href="#contact">Contact</a>
      </div>
    </section>

    <section class="section about" id="about" aria-labelledby="about-title">
      <h2 class="section__title" id="about-title">About Me</h2>
      <div class="about__content">
        <img class="about__photo" src="images/profile.svg" alt="[이름]의 프로필 이미지" width="200" height="200">
        <div class="about__text">
          <p>[자기소개 문단]</p>
          <p>[관심사 / 목표]</p>
        </div>
      </div>
    </section>

    <section class="section skills" id="skills" aria-labelledby="skills-title">
      <h2 class="section__title" id="skills-title">Skills</h2>
      <ul class="skills__list">
        <li class="skills__item">HTML</li>
        <li class="skills__item">CSS</li>
        <li class="skills__item">JavaScript</li>
        <li class="skills__item">Git</li>
        <li class="skills__item">Python</li>
      </ul>
    </section>

    <section class="section projects" id="projects" aria-labelledby="projects-title">
      <h2 class="section__title" id="projects-title">Projects</h2>
      <p class="projects__desc">GitHub 저장소 목록을 불러와 보여줍니다.</p>
      <!-- 로딩/성공/에러/빈 상태는 js/main.js 가 이 영역에 렌더링한다 (a-5) -->
      <div class="projects__status" aria-live="polite"></div>
      <div class="projects__grid"></div>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <h2 class="section__title" id="contact-title">Contact</h2>
      <form class="contact__form" novalidate>
        <div class="form__field">
          <label for="contact-name">이름</label>
          <input id="contact-name" name="name" type="text" autocomplete="name">
          <p class="form__error" id="contact-name-error" aria-live="polite"></p>
        </div>
        <div class="form__field">
          <label for="contact-email">이메일</label>
          <input id="contact-email" name="email" type="email" autocomplete="email">
          <p class="form__error" id="contact-email-error" aria-live="polite"></p>
        </div>
        <div class="form__field">
          <label for="contact-message">메시지</label>
          <textarea id="contact-message" name="message" rows="5"></textarea>
          <p class="form__error" id="contact-message-error" aria-live="polite"></p>
        </div>
        <button class="btn btn--primary" type="submit">Send</button>
        <p class="form__success" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span class="footer__year">2026</span> [이름]</p>
    <ul class="footer__social">
      <li><a href="https://github.com/KKamtte" target="_blank" rel="noopener noreferrer">GitHub</a></li>
    </ul>
  </footer>

  <button class="scroll-top" type="button" aria-label="맨 위로 이동">↑</button>
</body>
</html>
